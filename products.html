<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase | Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./index.html">ShopEase</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="./products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="./wishlist.html">Wishlist</a></li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="./cart.html">
                Cart <span class="badge text-bg-primary rounded-pill" id="cartCount">0</span>
              </a>
            </li>
          </ul>
          <form class="d-flex me-lg-3 mb-3 mb-lg-0" role="search" id="searchForm">
            <input
              class="form-control me-2"
              type="search"
              id="navbarSearch"
              placeholder="Search products..."
              aria-label="Search products"
            />
            <button class="btn btn-outline-primary" type="submit">Search</button>
          </form>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="./login.html">Login</a>
            <a class="btn btn-primary btn-sm" href="./signup.html">Signup</a>
            <button class="btn btn-outline-dark btn-sm" id="themeToggle" type="button">
              Dark
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="py-4">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
          <h1 class="h3 mb-0">All Products</h1>
          <div class="d-flex align-items-center gap-2">
            <label for="sortSelect" class="form-label mb-0">Sort by</label>
            <select id="sortSelect" class="form-select">
              <option value="newest">Newest</option>
              <option value="price-low-high">Price: Low to High</option>
              <option value="price-high-low">Price: High to Low</option>
              <option value="rating-high-low">Rating</option>
            </select>
          </div>
        </div>

        <div class="row g-4">
          <aside class="col-12 col-lg-3">
            <div class="filter-box p-3 bg-body">
              <h2 class="h5 mb-3">Filters</h2>

              <div class="mb-4">
                <h3 class="h6">Category</h3>
                <div id="categoryFilters" class="d-grid gap-2"></div>
              </div>

              <div class="mb-4">
                <h3 class="h6">Max Price</h3>
                <input type="range" id="priceRange" class="form-range" min="10" max="200" step="1" value="200" />
                <p class="mb-0 small text-secondary">Up to <span id="priceValue">$200</span></p>
              </div>

              <div>
                <h3 class="h6">Minimum Rating</h3>
                <select id="ratingFilter" class="form-select">
                  <option value="0">All Ratings</option>
                  <option value="4.5">4.5+</option>
                  <option value="4">4.0+</option>
                  <option value="3.5">3.5+</option>
                </select>
              </div>
            </div>
          </aside>

          <section class="col-12 col-lg-9">
            <div class="row g-4" id="productsGrid"></div>
          </section>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./js/products.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/products-page.js"></script>
  </body>
</html>
