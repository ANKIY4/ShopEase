<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./index.html">ShopEase</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="./products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="./wishlist.html">Wishlist</a></li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2" href="./cart.html">
                Cart <span class="badge text-bg-primary rounded-pill" id="cartCount">0</span>
              </a>
            </li>
          </ul>
          <form class="d-flex me-lg-3 mb-3 mb-lg-0" role="search" id="searchForm">
            <input class="form-control me-2" type="search" id="navbarSearch" placeholder="Search products..." />
            <button class="btn btn-outline-primary" type="submit">Search</button>
          </form>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="./login.html">Login</a>
            <a class="btn btn-primary btn-sm" href="./signup.html">Signup</a>
            <button class="btn btn-outline-dark btn-sm" id="themeToggle" type="button">
              Dark
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="py-4">
      <div class="container">
        <h1 class="h3 mb-4">Checkout</h1>
        <div id="checkoutAlert"></div>
        <div class="row g-4">
          <div class="col-12 col-lg-8">
            <form id="checkoutForm" class="needs-validation" novalidate>
              <div class="summary-card p-4 bg-body mb-4">
                <h2 class="h5 mb-3">Shipping Details</h2>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName" required />
                    <div class="invalid-feedback">Please enter full name.</div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required />
                    <div class="invalid-feedback">Please enter valid email.</div>
                  </div>
                  <div class="col-12">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" required />
                    <div class="invalid-feedback">Please enter address.</div>
                  </div>
                  <div class="col-12 col-md-4">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" required />
                    <div class="invalid-feedback">Please enter city.</div>
                  </div>
                  <div class="col-12 col-md-4">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" required />
                    <div class="invalid-feedback">Please enter state.</div>
                  </div>
                  <div class="col-12 col-md-4">
                    <label for="zipCode" class="form-label">Zip Code</label>
                    <input type="text" class="form-control" id="zipCode" required />
                    <div class="invalid-feedback">Please enter zip code.</div>
                  </div>
                </div>
              </div>

              <div class="summary-card p-4 bg-body mb-4">
                <h2 class="h5 mb-3">Payment Method</h2>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="codMethod" value="cod" checked />
                  <label class="form-check-label" for="codMethod">Cash on Delivery</label>
                </div>
                <div class="form-check mb-3">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="cardMethod" value="card" />
                  <label class="form-check-label" for="cardMethod">Card (UI only)</label>
                </div>
                <div id="cardFields" class="row g-3 d-none">
                  <div class="col-12">
                    <label for="cardNumber" class="form-label">Card Number</label>
                    <input type="text" class="form-control" id="cardNumber" />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="expiryDate" class="form-label">Expiry</label>
                    <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" />
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="cvv" class="form-label">CVV</label>
                    <input type="text" class="form-control" id="cvv" />
                  </div>
                </div>
              </div>

              <button class="btn btn-primary btn-lg" type="submit">Place Order</button>
            </form>
          </div>

          <div class="col-12 col-lg-4">
            <div class="summary-card p-4 bg-body">
              <h2 class="h5 mb-3">Order Summary</h2>
              <div id="checkoutSummary"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="./js/products.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/checkout.js"></script>
  </body>
</html>
